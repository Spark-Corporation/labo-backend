spring:
  application:
    name: lims-backend
  profiles:
    active: ${LIMS_PROFILES:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lims}
    username: ${DB_USER:lims}
    password: ${DB_PASSWORD:lims}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: lims
  liquibase:
    change-log: classpath:db/changelog/master.changelog.yaml
    default-schema: lims
    liquibase-schema: lims_liquibase
  modulith:
    events:
      # Schema for event_publication / event_publication_archive is managed by
      # Liquibase (changeset 202605120825-create-event-publication-tables).
      jdbc-schema-initialization:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

secured-x:
  jwt:
    private-key: ${SECURED_X_JWT_PRIVATE_KEY:classpath:keys/dev/private.pem}
    public-key: ${SECURED_X_JWT_PUBLIC_KEY:classpath:keys/dev/public.pem}
    issuer: lims
    audience: lims
    expiration: 86400000
    refresh-expiration: 604800000
  security:
    public-paths:
      - /auth/**
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
  rbac:
    resolution-mode: RESOLVER

lims:
  lab:
    code-prefix: LAB
    code: LAB
  pricing:
    b-rate: 400
  iam:
    bootstrap:
      enabled: true
      admin-email: ${LIMS_BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${LIMS_BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.sparkcorporation.lims: DEBUG

spring:
  application:
    name: lims-backend
  profiles:
    active: ${LIMS_PROFILES:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lims}
    username: ${DB_USER:lims}
    password: ${DB_PASSWORD:lims}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: lims
  liquibase:
    change-log: classpath:db/changelog/master.changelog.yaml
    default-schema: lims
    liquibase-schema: lims_liquibase
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

lims:
  lab:
    code-prefix: LAB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.sparkcorporation.lims: DEBUG

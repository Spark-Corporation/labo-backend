<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Reçu de paiement</title>
  <style>
    @page { size: A5 portrait; margin: 10mm 12mm 12mm 12mm; }
    body  { font-family: 'DejaVu Sans', sans-serif; font-size: 10pt; color: #111; }
    h1    { font-size: 14pt; text-align: center; margin: 4mm 0; }
    .lab  { font-size: 11pt; font-weight: bold; }
    .meta { font-size: 8.5pt; color: #555; }
    table { width: 100%; border-collapse: collapse; margin-top: 4mm; }
    th, td { text-align: left; padding: 1.5mm 2mm; border-bottom: 0.3pt solid #ddd; }
    th    { width: 35%; }
    .amount { font-size: 12pt; font-weight: bold; text-align: right; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0;
              font-size: 8pt; color: #888; text-align: center; }
  </style>
</head>
<body>

  <div>
    <div class="lab" th:text="${labIdentity.name}">Laboratoire</div>
    <div class="meta" th:text="${labIdentity.address}">Adresse</div>
    <div class="meta" th:text="${header.receiptNumber}">Reçu N°</div>
    <div class="meta" th:text="'Émis le ' + ${header.issuedAtDisplay}">Émis le</div>
  </div>

  <h1>REÇU DE PAIEMENT</h1>

  <table>
    <tr><th>Patient</th>
        <td th:text="${patient.lastName} + ' ' + ${patient.firstName}">Nom</td></tr>
    <tr><th>Dossier</th><td th:text="${labFile.dailyId}">LF-…</td></tr>
    <tr><th>Mode</th><td th:text="${payment.modeDisplay}">Espèces</td></tr>
    <tr><th>Montant</th>
        <td class="amount" th:text="${payment.amountDisplay}">0 F CFA</td></tr>
    <tr><th>Caisse</th>
        <td th:text="${cashRegister.code} + ' — ' + ${cashRegister.label}">CR-01</td></tr>
    <tr><th>Caissier</th><td th:text="${cashier.displayName}">N…</td></tr>
  </table>

  <div class="footer">
    <span th:text="'— ' + ${labIdentity.name} +
                   ' — Accréditation : ' + ${labIdentity.accreditationNumber} +
                   ' — Directeur : ' + ${labIdentity.managerName} + ' —'">— pied —</span>
  </div>

</body>
</html>

spring:
  liquibase:
    contexts: test
# OpenApiDocumentIT asserts the document stays complete, so the schema endpoint must be up.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
lims:
  signing:
    # Fixed test key so ITs are deterministic and don't need the LIMS_SIGNING_KEK env var.
    key-encryption-key: VR6qSfkiiulXOMY2rXP/LJW9eORmgW81miTOhOa9gbY=
  attachment:
    storage:
      backend: filesystem
      fs:
        root: target/it-attachments
logging:
  level:
    root: WARN

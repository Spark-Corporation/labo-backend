springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Keep operations grouped by controller tag rather than one flat 188-entry list.
    tags-sorter: alpha
    operations-sorter: method

lims:
  lab:
    code-prefix: DEV
  iam:
    bootstrap:
      admin-email: admin@local.dev
      admin-password: admin-dev-only-do-not-prod

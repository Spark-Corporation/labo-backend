databaseChangeLog:
  - changeSet:
      id: 202605061600-seed-catalog-code-counters
      author: samuel
      labels: phase-1-3-b-i,catalog,seed
      contextFilter: dev,test,prod
      preConditions:
        onFail: MARK_RAN
        onFailMessage: "Counter rows already seeded"
        sqlCheck:
          expectedResult: 0
          sql: SELECT count(*) FROM catalog_code_counters
      changes:
        - insert:
            tableName: catalog_code_counters
            columns:
              - column: { name: entity_type, value: PRESCRIBER }
              - column: { name: next_sequence, valueNumeric: 1 }
              - column: { name: version, valueNumeric: 0 }
        - insert:
            tableName: catalog_code_counters
            columns:
              - column: { name: entity_type, value: PRELEVEUR }
              - column: { name: next_sequence, valueNumeric: 1 }
              - column: { name: version, valueNumeric: 0 }

databaseChangeLog:
  - changeSet:
      id: 202605180905-create-cashbox-expenses
      author: samuel
      changes:
        - createTable:
            tableName: cashbox_expenses
            columns:
              - column: { name: id, type: "varchar(26)", constraints: { primaryKey: true, nullable: false } }
              - column: { name: category_id, type: "varchar(26)", constraints: { nullable: false } }
              - column: { name: mode, type: "varchar(16)", constraints: { nullable: false } }
              - column: { name: amount, type: "numeric(18,2)", constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column: { name: justification_scan_uri, type: TEXT }
              - column: { name: cash_register_id, type: "varchar(26)", constraints: { nullable: false } }
              - column: { name: recorded_by, type: "varchar(26)", constraints: { nullable: false } }
              - column: { name: recorded_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: created_by, type: "varchar(26)" }
              - column: { name: updated_by, type: "varchar(26)" }
              - column: { name: version, type: BIGINT, constraints: { nullable: false }, defaultValueNumeric: 0 }
        - addForeignKeyConstraint:
            constraintName: fk_cashbox_expenses_category
            baseTableName: cashbox_expenses
            baseColumnNames: category_id
            referencedTableName: cashbox_expense_categories
            referencedColumnNames: id
        - createIndex:
            indexName: idx_cashbox_expenses_register_recorded
            tableName: cashbox_expenses
            columns:
              - column: { name: cash_register_id }
              - column: { name: recorded_at }
        - createIndex:
            indexName: idx_cashbox_expenses_category
            tableName: cashbox_expenses
            columns:
              - column: { name: category_id }
        - sql:
            sql: |
              ALTER TABLE cashbox_expenses
                ADD CONSTRAINT cashbox_expenses_mode_chk
                  CHECK (mode IN ('CASH','CHEQUE','CARD_TPE','FLOOZ','MIXX_BY_YAS'));
              ALTER TABLE cashbox_expenses
                ADD CONSTRAINT cashbox_expenses_amount_chk
                  CHECK (amount > 0);

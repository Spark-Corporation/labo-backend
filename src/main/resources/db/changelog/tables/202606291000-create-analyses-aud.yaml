databaseChangeLog:
  - changeSet:
      id: 202606291000-create-analyses-aud
      author: samuel
      contextFilter: dev,test,prod
      labels: sp12-catalog-audit
      preConditions:
        - onFail: HALT
        - tableExists: { tableName: revinfo }
        - not:
            - tableExists: { tableName: analyses_aud }
      changes:
        # Envers audit-history table for the @Audited Analysis aggregate (SP12, CDC Configurations
        # §8/§9). Columns/types/nullability/PK transcribed verbatim from hbm2ddl (Hibernate 7.2.x)
        # so ddl-auto=validate matches the runtime audit mapping exactly. Enum CHECK constraints
        # emitted by hbm2ddl are intentionally omitted (validate ignores them; the base table does
        # not carry them either). The embedded Units unit_1/unit_2 columns are varchar(255) and
        # unit_1_to_2_factor is numeric(38,2) here (no length/precision hint on the embeddable),
        # not the base-table varchar(20)/numeric(18,6) — validate compares against THIS.
        - createTable:
            tableName: analyses_aud
            columns:
              - column: { name: id, type: varchar(26), constraints: { nullable: false } }
              - column: { name: rev, type: int, constraints: { nullable: false } }
              - column: { name: revtype, type: smallint }
              - column: { name: code, type: varchar(30) }
              - column: { name: name, type: varchar(160) }
              - column: { name: kind, type: varchar(20) }
              - column: { name: indiciary_value_b, type: "numeric(10,2)" }
              - column: { name: label_count, type: integer }
              - column: { name: discipline_id, type: varchar(26) }
              - column: { name: matrix_id, type: varchar(26) }
              - column: { name: recipient_id, type: varchar(26) }
              - column: { name: result_type, type: varchar(10) }
              - column: { name: interpretation_text, type: TEXT }
              - column: { name: formula_expression, type: TEXT }
              - column: { name: default_portoir, type: varchar(20) }
              - column: { name: default_conservation_days, type: integer }
              - column: { name: unit_1, type: varchar(255) }
              - column: { name: unit_1_decimals, type: integer }
              - column: { name: unit_2, type: varchar(255) }
              - column: { name: unit_2_decimals, type: integer }
              - column: { name: unit_1_to_2_factor, type: "numeric(38,2)" }
              - column: { name: delay_days, type: integer }
              - column: { name: delay_hours, type: integer }
              - column: { name: anteriority_count, type: integer }
              - column: { name: created_at, type: "timestamp(6) with time zone" }
              - column: { name: updated_at, type: "timestamp(6) with time zone" }
              - column: { name: deleted_at, type: "timestamp(6) with time zone" }
        - addPrimaryKey:
            tableName: analyses_aud
            columnNames: "rev, id"
            constraintName: pk_analyses_aud
        - addForeignKeyConstraint:
            baseTableName: analyses_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_analyses_aud_revinfo
      # rollback: AUTHORED BY USER

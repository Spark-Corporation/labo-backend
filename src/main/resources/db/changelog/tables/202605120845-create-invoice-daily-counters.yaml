databaseChangeLog:
  - changeSet:
      id: 202605120845-create-invoice-daily-counters
      author: samuel
      changes:
        - createTable:
            tableName: invoice_daily_counters
            columns:
              - column: { name: lab_code, type: varchar(3), constraints: { nullable: false } }
              - column: { name: date,     type: DATE,       constraints: { nullable: false } }
              - column: { name: last_seq, type: INTEGER,    constraints: { nullable: false } }
              - column: { name: version,  type: BIGINT,     constraints: { nullable: false }, defaultValueNumeric: 0 }
        - addPrimaryKey:
            tableName: invoice_daily_counters
            columnNames: lab_code, date
            constraintName: pk_invoice_daily_counters
        - sql:
            sql: |
              ALTER TABLE invoice_daily_counters
                ADD CONSTRAINT invoice_daily_counters_lab_code_chk
                CHECK (lab_code ~ '^[A-Z]{3}$');
              ALTER TABLE invoice_daily_counters
                ADD CONSTRAINT invoice_daily_counters_last_seq_chk
                CHECK (last_seq >= 0);
      # rollback: AUTHORED BY USER

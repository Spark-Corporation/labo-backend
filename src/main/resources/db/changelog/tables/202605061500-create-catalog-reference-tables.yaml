databaseChangeLog:
  - changeSet:
      id: 202605061500-create-catalog-reference-tables
      author: samuel
      labels: phase-1-3-a
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { tableName: disciplines }
      changes:
        # ---- disciplines ----
        - createTable:
            tableName: disciplines
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: deleted_at, type: timestamptz }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column: { name: created_by, type: varchar(26) }
              - column: { name: updated_by, type: varchar(26) }
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }

        # ---- matrices ----
        - createTable:
            tableName: matrices
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: deleted_at, type: timestamptz }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column: { name: created_by, type: varchar(26) }
              - column: { name: updated_by, type: varchar(26) }
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }

        # ---- techniques ----
        - createTable:
            tableName: techniques
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: deleted_at, type: timestamptz }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column: { name: created_by, type: varchar(26) }
              - column: { name: updated_by, type: varchar(26) }
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }

        # ---- recipients (extra columns + FK to matrices) ----
        - createTable:
            tableName: recipients
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: color, type: varchar(30) }
              - column: { name: volume_ml, type: "numeric(6,2)" }
              - column: { name: default_matrix_id, type: varchar(26) }
              - column: { name: deleted_at, type: timestamptz }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column: { name: created_by, type: varchar(26) }
              - column: { name: updated_by, type: varchar(26) }
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: recipients
            baseColumnNames: default_matrix_id
            referencedTableName: matrices
            referencedColumnNames: id
            constraintName: fk_recipients_default_matrix
            onDelete: SET NULL
        - createIndex:
            indexName: idx_recipients_default_matrix
            tableName: recipients
            columns:
              - column: { name: default_matrix_id }

        # ---- antibiotics (extra columns) ----
        - createTable:
            tableName: antibiotics
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: family, type: varchar(80) }
              - column: { name: reference_diameter, type: "numeric(5,2)", constraints: { nullable: false } }
              - column: { name: intermediate_lower, type: "numeric(5,2)" }
              - column: { name: intermediate_upper, type: "numeric(5,2)" }
              - column: { name: deleted_at, type: timestamptz }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column: { name: created_by, type: varchar(26) }
              - column: { name: updated_by, type: varchar(26) }
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }

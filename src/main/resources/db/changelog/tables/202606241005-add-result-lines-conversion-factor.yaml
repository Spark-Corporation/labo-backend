databaseChangeLog:
  - changeSet:
      id: 202606241005-add-result-lines-conversion-factor
      author: samuel
      contextFilter: dev,test,prod
      labels: sp11-unit2
      preconditions:
        - onFail: HALT
        - tableExists: { tableName: result_lines }
      changes:
        - addColumn:
            tableName: result_lines
            columns:
              - column: { name: unit_1_to_2_factor, type: "numeric(18,6)" }
        # ResultLine is @Audited (SP8 Envers) — the hand-authored *_aud table needs the column too.
        - addColumn:
            tableName: result_lines_aud
            columns:
              - column: { name: unit_1_to_2_factor, type: "numeric(18,6)" }
      # rollback: AUTHORED BY USER

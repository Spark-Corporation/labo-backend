databaseChangeLog:
  - changeSet:
      id: 202605180900-create-cashbox-expense-categories
      author: samuel
      changes:
        - createTable:
            tableName: cashbox_expense_categories
            columns:
              - column: { name: id, type: "varchar(26)", constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: "varchar(32)", constraints: { nullable: false, unique: true, uniqueConstraintName: uq_cashbox_expense_categories_code } }
              - column: { name: label, type: "varchar(200)", constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, constraints: { nullable: false }, defaultValueBoolean: true }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: created_by, type: "varchar(26)" }
              - column: { name: updated_by, type: "varchar(26)" }
              - column: { name: version, type: BIGINT, constraints: { nullable: false }, defaultValueNumeric: 0 }
        - sql:
            sql: |
              ALTER TABLE cashbox_expense_categories
                ADD CONSTRAINT cashbox_expense_categories_code_chk
                  CHECK (code ~ '^[A-Z0-9_-]{1,32}$');

databaseChangeLog:
  - changeSet:
      id: 202605071000-create-catalog-analysis-tables
      author: samuel
      labels: phase-1-3-b-ii,catalog,analyses
      preConditions:
        onFail: HALT
        onFailMessage: "Analysis tables already exist"
        sqlCheck:
          expectedResult: 0
          sql: |
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'analyses'
      changes:
        # ---- analyses (main aggregate) ----
        - createTable:
            tableName: analyses
            columns:
              - column: { name: id,                        type: varchar(26),   constraints: { primaryKey: true, nullable: false } }
              - column: { name: code,                      type: varchar(30),   constraints: { nullable: false, unique: true } }
              - column: { name: name,                      type: varchar(160),  constraints: { nullable: false } }
              - column: { name: kind,                      type: varchar(20),   constraints: { nullable: false } }
              - column: { name: indiciary_value_b,         type: "numeric(10,2)", constraints: { nullable: false } }
              - column:
                  name: label_count
                  type: int
                  defaultValueNumeric: 1
                  constraints: { nullable: false }
              - column: { name: discipline_id,             type: varchar(26),   constraints: { nullable: false } }
              - column: { name: matrix_id,                 type: varchar(26) }
              - column: { name: recipient_id,              type: varchar(26) }
              - column: { name: result_type,               type: varchar(10),   constraints: { nullable: false } }
              - column: { name: interpretation_text,       type: text }
              - column: { name: default_portoir,           type: varchar(20) }
              - column: { name: default_conservation_days, type: int }
              # embedded Units VO (5 cols, all nullable)
              - column: { name: unit_1,                    type: varchar(20) }
              - column: { name: unit_1_decimals,           type: integer }
              - column: { name: unit_2,                    type: varchar(20) }
              - column: { name: unit_2_decimals,           type: integer }
              - column: { name: unit_1_to_2_factor,        type: "numeric(18,6)" }
              # embedded AnalyticalDelay VO (3 cols, all nullable)
              - column: { name: delay_days,                type: int }
              - column: { name: delay_hours,               type: int }
              - column: { name: anteriority_count,         type: int }
              # audit (no created_by/updated_by — see spec §4.2.1)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: deleted_at,                type: timestamptz }

        - addForeignKeyConstraint:
            constraintName: fk_analyses_discipline
            baseTableName: analyses
            baseColumnNames: discipline_id
            referencedTableName: disciplines
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_analyses_matrix
            baseTableName: analyses
            baseColumnNames: matrix_id
            referencedTableName: matrices
            referencedColumnNames: id
            onDelete: SET NULL

        - addForeignKeyConstraint:
            constraintName: fk_analyses_recipient
            baseTableName: analyses
            baseColumnNames: recipient_id
            referencedTableName: recipients
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            indexName: idx_analyses_kind
            tableName: analyses
            columns:
              - column: { name: kind }
        - createIndex:
            indexName: idx_analyses_discipline
            tableName: analyses
            columns:
              - column: { name: discipline_id }
        - createIndex:
            indexName: idx_analyses_matrix
            tableName: analyses
            columns:
              - column: { name: matrix_id }
        - createIndex:
            indexName: idx_analyses_recipient
            tableName: analyses
            columns:
              - column: { name: recipient_id }
        - createIndex:
            indexName: idx_analyses_name
            tableName: analyses
            columns:
              - column: { name: name }

        # ---- analysis_components (parent ⊃ children, position-ordered) ----
        - createTable:
            tableName: analysis_components
            columns:
              - column: { name: parent_id, type: varchar(26), constraints: { nullable: false } }
              - column: { name: child_id,  type: varchar(26), constraints: { nullable: false } }
              - column: { name: position,  type: int,         constraints: { nullable: false } }

        - addPrimaryKey:
            constraintName: pk_analysis_components
            tableName: analysis_components
            columnNames: "parent_id, child_id"

        - addForeignKeyConstraint:
            constraintName: fk_analysis_components_parent
            baseTableName: analysis_components
            baseColumnNames: parent_id
            referencedTableName: analyses
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            constraintName: fk_analysis_components_child
            baseTableName: analysis_components
            baseColumnNames: child_id
            referencedTableName: analyses
            referencedColumnNames: id
            onDelete: RESTRICT

        - createIndex:
            indexName: idx_analysis_components_child
            tableName: analysis_components
            columns:
              - column: { name: child_id }

        # ---- analysis_techniques (M2M with default flag) ----
        - createTable:
            tableName: analysis_techniques
            columns:
              - column: { name: analysis_id,  type: varchar(26), constraints: { nullable: false } }
              - column: { name: technique_id, type: varchar(26), constraints: { nullable: false } }
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }

        - addPrimaryKey:
            constraintName: pk_analysis_techniques
            tableName: analysis_techniques
            columnNames: "analysis_id, technique_id"

        - addForeignKeyConstraint:
            constraintName: fk_analysis_techniques_analysis
            baseTableName: analysis_techniques
            baseColumnNames: analysis_id
            referencedTableName: analyses
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            constraintName: fk_analysis_techniques_technique
            baseTableName: analysis_techniques
            baseColumnNames: technique_id
            referencedTableName: techniques
            referencedColumnNames: id
            onDelete: RESTRICT

        - createIndex:
            indexName: idx_analysis_techniques_technique
            tableName: analysis_techniques
            columns:
              - column: { name: technique_id }

        # ---- reference_intervals ----
        - createTable:
            tableName: reference_intervals
            columns:
              - column: { name: id,           type: varchar(26),   constraints: { primaryKey: true, nullable: false } }
              - column: { name: analysis_id,  type: varchar(26),   constraints: { nullable: false } }
              - column: { name: category,     type: varchar(25),   constraints: { nullable: false } }
              - column: { name: sex,          type: char(1) }
              - column: { name: age_min,      type: int }
              - column: { name: age_max,      type: int }
              - column: { name: age_unit,     type: varchar(10) }
              - column: { name: mode,         type: varchar(10),   constraints: { nullable: false } }
              - column: { name: unit_1_min,   type: "numeric(18,4)" }
              - column: { name: unit_1_max,   type: "numeric(18,4)" }
              - column: { name: unit_2_min,   type: "numeric(18,4)" }
              - column: { name: unit_2_max,   type: "numeric(18,4)" }
              - column: { name: comment_text, type: text }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: deleted_at,   type: timestamptz }

        - addForeignKeyConstraint:
            constraintName: fk_reference_intervals_analysis
            baseTableName: reference_intervals
            baseColumnNames: analysis_id
            referencedTableName: analyses
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_reference_intervals_analysis
            tableName: reference_intervals
            columns:
              - column: { name: analysis_id }
        - createIndex:
            indexName: idx_reference_intervals_category
            tableName: reference_intervals
            columns:
              - column: { name: category }

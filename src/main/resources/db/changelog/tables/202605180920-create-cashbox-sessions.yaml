# TODO: author rollback block — domain semantics required (CLAUDE.md rule)
databaseChangeLog:
  - changeSet:
      id: 202605180920-create-cashbox-sessions
      author: samuel
      changes:
        - createTable:
            tableName: cashbox_sessions
            columns:
              - column: { name: cash_register_id, type: "varchar(26)", constraints: { nullable: false } }
              - column: { name: session_date, type: DATE, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(16)", constraints: { nullable: false }, defaultValue: "OPEN" }
              - column: { name: cash_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: cheque_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: card_tpe_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: flooz_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: mixx_by_yas_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: expenses_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: home_collection_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: grand_total, type: "numeric(18,2)", constraints: { nullable: false }, defaultValueNumeric: 0 }
              - column: { name: closed_by, type: "varchar(26)" }
              - column: { name: closed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: reopened_by, type: "varchar(26)" }
              - column: { name: reopened_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: reopen_reason, type: "varchar(1024)" }
              - column: { name: version, type: BIGINT, constraints: { nullable: false }, defaultValueNumeric: 0 }
        - addPrimaryKey:
            tableName: cashbox_sessions
            columnNames: cash_register_id, session_date
            constraintName: pk_cashbox_sessions
        - sql:
            sql: |
              ALTER TABLE cashbox_sessions
                ADD CONSTRAINT cashbox_sessions_status_chk
                  CHECK (status IN ('OPEN','CLOSED'));

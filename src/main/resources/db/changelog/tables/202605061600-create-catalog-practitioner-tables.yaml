databaseChangeLog:
  - changeSet:
      id: 202605061600-create-catalog-practitioner-tables
      author: samuel
      labels: phase-1-3-b-i,catalog,practitioners
      preConditions:
        onFail: HALT
        onFailMessage: "Practitioner tables already exist"
        sqlCheck:
          expectedResult: 0
          sql: |
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'specialties'
      changes:
        # ---- specialties ----
        - createTable:
            tableName: specialties
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: description, type: varchar(255) }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: deleted_at, type: timestamptz }

        # ---- prescribers ----
        - createTable:
            tableName: prescribers
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: title, type: varchar(10) }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: specialty_id, type: varchar(26) }
              - column: { name: phone, type: varchar(30) }
              - column: { name: email, type: varchar(120) }
              - column: { name: license_number, type: varchar(40) }
              - column: { name: institution, type: varchar(120) }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: deleted_at, type: timestamptz }

        - addForeignKeyConstraint:
            constraintName: fk_prescribers_specialty
            baseTableName: prescribers
            baseColumnNames: specialty_id
            referencedTableName: specialties
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            indexName: idx_prescribers_specialty
            tableName: prescribers
            columns:
              - column: { name: specialty_id }

        - createIndex:
            indexName: idx_prescribers_name
            tableName: prescribers
            columns:
              - column: { name: name }

        # ---- preleveurs ----
        - createTable:
            tableName: preleveurs
            columns:
              - column: { name: id, type: varchar(26), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: varchar(30), constraints: { nullable: false, unique: true } }
              - column: { name: name, type: varchar(120), constraints: { nullable: false } }
              - column: { name: phone, type: varchar(30) }
              - column: { name: email, type: varchar(120) }
              - column: { name: user_id, type: varchar(26) }
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: deleted_at, type: timestamptz }

        - addForeignKeyConstraint:
            constraintName: fk_preleveurs_user
            baseTableName: preleveurs
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            indexName: idx_preleveurs_user
            tableName: preleveurs
            columns:
              - column: { name: user_id }

        - createIndex:
            indexName: idx_preleveurs_name
            tableName: preleveurs
            columns:
              - column: { name: name }

        # ---- preleveur_habilitations (join table for CDC §5 enum set) ----
        - createTable:
            tableName: preleveur_habilitations
            columns:
              - column: { name: preleveur_id, type: varchar(26), constraints: { nullable: false } }
              - column: { name: habilitation, type: varchar(40), constraints: { nullable: false } }

        - addPrimaryKey:
            tableName: preleveur_habilitations
            columnNames: "preleveur_id, habilitation"
            constraintName: pk_preleveur_habilitations

        - addForeignKeyConstraint:
            constraintName: fk_preleveur_habilitations_preleveur
            baseTableName: preleveur_habilitations
            baseColumnNames: preleveur_id
            referencedTableName: preleveurs
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_preleveur_habs_hab
            tableName: preleveur_habilitations
            columns:
              - column: { name: habilitation }

        # ---- catalog_code_counters (auto-gen sequence backing) ----
        - createTable:
            tableName: catalog_code_counters
            columns:
              - column: { name: entity_type, type: varchar(20), constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: next_sequence
                  type: bigint
                  defaultValueNumeric: 1
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
